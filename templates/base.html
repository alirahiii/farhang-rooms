<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}اتاق‌های گفتگوی فرهنگ و هنر{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        vazir: ['Vazirmatn', 'sans-serif'],
                    },
                },
            },
        };
    </script>
    <style>
        [id^="comment-"]:target {
            animation: comment-highlight 3s ease-out;
        }
        @keyframes comment-highlight {
            0% { box-shadow: inset 0 0 0 999px rgba(250, 204, 21, 0.35); }
            100% { box-shadow: inset 0 0 0 999px rgba(250, 204, 21, 0); }
        }
    </style>
</head>
<body class="font-vazir bg-gray-50 text-gray-900 min-h-screen flex flex-col">
    <header class="bg-white border-b">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <span class="text-lg font-bold">اتاق‌های گفتگوی فرهنگ و هنر</span>
            <nav>
                <a href="{% url 'home' %}#categories" class="text-gray-700 hover:text-gray-900">دسته‌بندی‌ها</a>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full">
        {% if messages %}
        <div class="mb-6 space-y-2">
            {% for message in messages %}
            <div class="bg-green-50 border border-green-300 text-green-800 rounded-lg px-4 py-3 text-sm">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t">
        <div class="max-w-4xl mx-auto px-4 py-4 text-center text-sm text-gray-500">
            اتاق‌های گفتگوی فرهنگ و هنر
        </div>
    </footer>
</body>
</html>
