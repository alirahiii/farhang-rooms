<details class="mt-2" {% if target.id == reply_target_id %}open{% endif %}>
    <summary class="cursor-pointer text-sm text-blue-600 w-fit">پاسخ</summary>
    <form method="post" class="mt-3 space-y-2">
        {% csrf_token %}
        <input type="hidden" name="parent_id" value="{{ target.id }}">
        {% if target.id == reply_target_id %}
        {% for field in reply_form %}
        <div>
            {{ field }}
            {% if field.errors %}
            <p class="text-red-600 text-xs mt-1">{{ field.errors|striptags }}</p>
            {% endif %}
        </div>
        {% endfor %}
        {% else %}
        <input type="text" name="author_name" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="نام شما (اختیاری)">
        <textarea name="body" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="پاسخ خود را بنویسید"></textarea>
        {% endif %}
        <button type="submit" class="bg-gray-900 text-white rounded-lg px-3 py-1.5 text-xs">ارسال پاسخ</button>
    </form>
</details>
